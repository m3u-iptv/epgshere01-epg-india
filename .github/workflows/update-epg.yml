              "ZEE.ZEST.in",
              "ZING.in",
              "ZOOM.in"
              # IN2 aur IN4 ke channel IDs yahan add karein
          }
          
          files = ["IN1.xml", "IN2.xml", "IN4.xml"]
          new_root = None
          added_channels = set()
          
          for file in files:
              tree = ET.parse(file)
              root = tree.getroot()
              
              if new_root is None:
                  new_root = ET.Element("tv", root.attrib)
                  
              for ch in root.findall("channel"):
                  ch_id = ch.get("id")
                  if ch_id in target_ids and ch_id not in added_channels:
                      new_root.append(ch)
                      added_channels.add(ch_id)
                      
              for prog in root.findall("programme"):
                  if prog.get("channel") in target_ids:
                      new_root.append(prog)
                  
          new_tree = ET.ElementTree(new_root)
          ET.indent(new_tree, space="  ")
          new_tree.write("epg.xml", encoding="utf-8", xml_declaration=True)
          '
          
          rm -f IN1.xml IN2.xml IN4.xml
          gzip -f epg.xml

      - name: Save and Push Filtered EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add epg.xml.gz
          git commit -m "Update EPG channels" || exit 0
          git push
